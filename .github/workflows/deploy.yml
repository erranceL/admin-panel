name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VITE_API_BASE_URL: https://surfv2-sit-api.nfexinsider.com
  VITE_API_TIMEOUT_MS: 10000
  VITE_ENABLE_ADMIN_WRITES: "true"
  VITE_ALLOW_MOCK_RECHARGE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert SIT demo build
        run: |
          if [ "${VITE_API_BASE_URL}" != "https://surfv2-sit-api.nfexinsider.com" ]; then
            echo "Unexpected SIT API base URL."
            exit 1
          fi
          if [ -n "${VITE_DEV_AUTH_TOKEN:-}" ]; then
            echo "Do not build GitHub Pages with a browser-visible auth token."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_BASE_PATH: /admin-panel/

      - name: Scan built assets
        run: |
          if grep -R -E "(BEGIN PRIVATE KEY|api[_-]?key|secret|Bearer |eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+)" dist; then
            echo "Potential secret or live API endpoint found in dist"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
